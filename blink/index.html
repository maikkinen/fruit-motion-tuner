<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfruit drawing blink</title>
<style>
  html, body { margin: 0; background: #FCFAF6; color: #3F523B; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .card { text-align: center; }
  object { width: min(92vw, 420px); height: min(92vw, 420px); }
  p { margin: 12px 0 0; opacity: 0.75; max-width: 22em; }
</style>
</head>
<body>
<main>
  <div class="card">
    <object type="image/svg+xml" data="starfruit-pose-blink.svg" width="420" height="420" aria-label="Starfruit drawing blink"></object>
    <p>Five eye drawings swap. The first blink is after about six seconds.</p>
  </div>
</main>
</body>
</html>
